# Baseline 1 - OpenRAG-Soc (Guo & Wei, 2026). Defaults follow Sec. 3.2 of the paper.
# Reduce corpus_scale / n_queries on a free T4 if you hit the session time limit.
seed: 0
corpus:
  seed: 13
  scale: 0.08           # 1.0 = full 6,200-page corpus; 0.08 ≈ 500 pages (~550 queries) fits a 20-min GPU run
  n_hard_negatives: 80
  n_svg: 60

retriever: bm25         # bm25 | dense
dense_model: intfloat/e5-base-v2
dense_query_prefix: "query: "
dense_doc_prefix: "passage: "

chunk_size: 512         # paper sweeps {256, 512, 768}
overlap: 128
k: 5                    # paper default; also try 3 and 10

llm:
  model_id: meta-llama/Meta-Llama-3-8B-Instruct
  load_in_4bit: true
  max_new_tokens: 128
  temperature: 0.2
  top_p: 0.9

attribution_retries: 1
configs: [Vanilla, Sanitized, Normalized, Attribution, Sanitized+Normalized, All Defenses]

poisoning:
  run: true
  fractions: [0.0, 0.01, 0.02, 0.05, 0.10]
  retrievers: [bm25, dense]
  compare: [Vanilla, Sanitized+Normalized]
  k: 10
  n_eval_queries: 200
